# Déploiement sur GitHub Pages — déclenché uniquement À LA MAIN (onglet Actions › « Déploiement GitHub Pages »),
# après validation de la responsable du projet (CLAUDE.md §7). Ne se lance jamais automatiquement.
name: Déploiement GitHub Pages

on:
  workflow_dispatch:
    inputs:
      reference:
        description: 'Branche ou étiquette (tag) à publier, par exemple main ou v1.0.0'
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Acceptation des modalités d'utilisation du DSFR par la responsable (DEC-030, fichier .dsfr.yml).
env:
  DSFR_ACCEPT_LICENSE: '1'

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reference }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier puis construire
        run: npm run verifier

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
