# Intégration continue : à chaque envoi sur GitHub et à chaque PR,
# vérifie la qualité du code, lance tous les tests et construit le widget.
name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Contrôler les vulnérabilités des dépendances d'exécution
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, types, tests, données sensibles, construction
        run: npm run verifier

      - name: Installer les navigateurs de test
        run: npx playwright install --with-deps chromium firefox

      - name: Tests de bout en bout
        run: npm run test:e2e
